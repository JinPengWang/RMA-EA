[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rma-ea"
version = "3.4.0"
description = "Riemannian Manifold Adaptive Evolutionary Algorithm: Log-Euclidean SPD metric flow, dual-chart atlas mutation, and geodesic diffusion on an L-SHADE skeleton"
authors = [
    { name = "Jinpeng Wang" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
